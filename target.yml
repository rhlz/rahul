

on:
  workflow_dispatch:
    inputs:

      phase2_repo:
        description: "Phase 2 repository"
        required: true
        type: string

      phase2_branch:
        description: "Phase 2 source branch"
        required: true
        type: string

      phase1_repo:
        description: "Phase 1 repository"
        required: true
        type: string

      phase1_branch:
        description: "Phase 1 target branch"
        required: true
        type: string

      sync_branch:
        description: "Temporary synchronization branch name"
        required: true
        type: string

      pr_title:
        description: "Pull Request title"
        required: true
        type: string

      pr_description:
        description: "Pull Request description"
        required: false
        type: string

jobs:

  sync:
    name: Sync Phase 2 → Phase 1
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Display synchronization details
        run: |
          echo "=========================================="
          echo "Phase 2 Repository : ${{ inputs.phase2_repo }}"
          echo "Phase 2 Branch     : ${{ inputs.phase2_branch }}"
          echo ""
          echo "Phase 1 Repository : ${{ inputs.phase1_repo }}"
          echo "Phase 1 Branch     : ${{ inputs.phase1_branch }}"
          echo ""
          echo "Sync Branch        : ${{ inputs.sync_branch }}"
          echo "PR Title           : ${{ inputs.pr_title }}"
          echo "=========================================="

      - name: Checkout Phase 1 repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.phase1_repo }}
          ref: ${{ inputs.phase1_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Phase 2 repository
        run: |
          git remote add phase2 \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/${{ inputs.phase2_repo }}.git

          git fetch phase2 "${{ inputs.phase2_branch }}"

      - name: Create synchronization branch
        run: |
          git checkout -b "${{ inputs.sync_branch }}"

      - name: Merge Phase 2 into Phase 1
        run: |
          git merge \
            "phase2/${{ inputs.phase2_branch }}" \
            --no-ff \
            -m "Sync Phase 2 into Phase 1"

      - name: Push synchronization branch
        run: |
          git push origin "${{ inputs.sync_branch }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ github.repository_owner }}/${{ inputs.phase1_repo }}" \
            --base "${{ inputs.phase1_branch }}" \
            --head "${{ inputs.sync_branch }}" \
            --title "${{ inputs.pr_title }}" \
            --body "${{ inputs.pr_description }}"

      - name: Summary
        run: |
          echo "=========================================="
          echo "SYNC COMPLETED"
          echo "=========================================="
          echo "Source Repository : ${{ inputs.phase2_repo }}"
          echo "Source Branch     : ${{ inputs.phase2_branch }}"
          echo "Target Repository : ${{ inputs.phase1_repo }}"
          echo "Target Branch     : ${{ inputs.phase1_branch }}"
          echo "Sync Branch       : ${{ inputs.sync_branch }}"
          echo "=========================================="
