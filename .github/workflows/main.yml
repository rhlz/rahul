name: Sync Phase 1 to Phase 2

on:
  workflow_dispatch:
    inputs:

      github_token:
        description: "GitHub PAT with access to source and target repositories"
        required: true
        type: string

      source_branch:
        description: "Source branch in current repository"
        required: true
        default: "main"
        type: string

      target_repo:
        description: "Target Phase 2 repository. Example: setup-single-family-activations-p2-ui"
        required: true
        type: string

      target_branch:
        description: "Target branch"
        required: true
        default: "main"
        type: string

      sync_branch:
        description: "Synchronization PR branch"
        required: true
        default: "sync/phase1-to-phase2"
        type: string

      pr_title:
        description: "Pull Request title"
        required: true
        default: "Sync Phase 1 to Phase 2"
        type: string

      pr_description:
        description: "Pull Request description"
        required: false
        default: "Synchronization from Phase 1 to Phase 2."
        type: string


jobs:

  sync:
    name: Phase 1 → Phase 2
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ inputs.github_token }}

    steps:

      # =========================================================
      # 1. Install tools
      # =========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y rsync

          git --version
          rsync --version | head -1
          gh --version


      # =========================================================
      # 2. Determine repositories
      # =========================================================

      - name: Set repository variables
        shell: bash
        run: |
          set -e

          SOURCE_REPO="${GITHUB_REPOSITORY}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          TARGET_REPO="${{ inputs.target_repo }}"

          # Allow either:
          #
          # setup-single-family-activations-p2-ui
          #
          # OR:
          #
          # conservice/setup-single-family-activations-p2-ui

          if [[ "$TARGET_REPO" != */* ]]; then
            TARGET_REPO="${OWNER}/${TARGET_REPO}"
          fi

          echo "SOURCE_REPO=${SOURCE_REPO}" >> "$GITHUB_ENV"
          echo "TARGET_REPO=${TARGET_REPO}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "SOURCE REPOSITORY"
          echo "=========================================="
          echo "${SOURCE_REPO}"

          echo ""
          echo "=========================================="
          echo "TARGET REPOSITORY"
          echo "=========================================="
          echo "${TARGET_REPO}"


      # =========================================================
      # 3. Configure authentication
      # =========================================================

      - name: Configure Git authentication
        shell: bash
        run: |
          set -e

          git config --global user.name "github-actions[bot]"

          git config \
            --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global credential.helper store

          echo \
            "https://x-access-token:${GH_TOKEN}@github.com" \
            > "$HOME/.git-credentials"

          chmod 600 "$HOME/.git-credentials"


      # =========================================================
      # 4. Clone source repository
      # =========================================================

      - name: Clone source repository
        shell: bash
        run: |
          set -e

          rm -rf source-repo

          git clone \
            --branch "${{ inputs.source_branch }}" \
            "https://github.com/${SOURCE_REPO}.git" \
            source-repo

          cd source-repo

          git checkout "${{ inputs.source_branch }}"

          echo ""
          echo "Source SHA:"
          git rev-parse HEAD


      # =========================================================
      # 5. Clone target repository
      # =========================================================

      - name: Clone target repository
        shell: bash
        run: |
          set -e

          rm -rf target-repo

          git clone \
            "https://github.com/${TARGET_REPO}.git" \
            target-repo

          cd target-repo

          git fetch --all --prune

          git checkout "${{ inputs.target_branch }}"

          git pull origin "${{ inputs.target_branch }}"

          echo ""
          echo "Target SHA:"
          git rev-parse HEAD


      # =========================================================
      # 6. Initialize / update sync baseline
      # =========================================================

      - name: Prepare synchronization baseline
        shell: bash
        run: |
          set -e

          cd target-repo

          BASELINE_BRANCH="sync-baseline"

          echo "Checking synchronization baseline..."

          # -------------------------------------------------------
          # Does baseline branch exist?
          # -------------------------------------------------------

          if git ls-remote \
              --exit-code \
              origin \
              "refs/heads/${BASELINE_BRANCH}" \
              >/dev/null 2>&1
          then

            echo "sync-baseline exists."

            git fetch origin \
              "${BASELINE_BRANCH}:refs/remotes/origin/${BASELINE_BRANCH}"

            BASELINE_SHA=$(git rev-parse \
              "refs/remotes/origin/${BASELINE_BRANCH}")

            echo "Current baseline:"
            echo "${BASELINE_SHA}"

          else

            echo "sync-baseline does not exist."

            echo "Initializing baseline from target branch."

            TARGET_SHA=$(git rev-parse \
              "origin/${{ inputs.target_branch }}")

            git checkout -B "${BASELINE_BRANCH}" \
              "${TARGET_SHA}"

            git push \
              origin \
              "${BASELINE_BRANCH}"

            BASELINE_SHA="${TARGET_SHA}"

          fi


          # -------------------------------------------------------
          # Find latest merged synchronization PR
          # -------------------------------------------------------

          echo ""
          echo "Checking for previously merged sync PR..."

          LAST_MERGED_SHA=$(
            gh pr list \
              --repo "${TARGET_REPO}" \
              --state merged \
              --base "${{ inputs.target_branch }}" \
              --head "${{ inputs.sync_branch }}" \
              --limit 50 \
              --json number,mergedAt,mergeCommit \
              --jq '
                map(
                  select(.mergedAt != null)
                )
                | sort_by(.mergedAt)
                | last
                | .mergeCommit.oid // empty
              '
          )

          if [[ -n "${LAST_MERGED_SHA}" ]]; then

            echo ""
            echo "Latest merged synchronization PR commit:"
            echo "${LAST_MERGED_SHA}"

            echo ""
            echo "Current baseline:"
            echo "${BASELINE_SHA}"

            if [[ "${LAST_MERGED_SHA}" != "${BASELINE_SHA}" ]]; then

              echo ""
              echo "Updating sync-baseline..."

              git fetch origin \
                "${LAST_MERGED_SHA}"

              git checkout -B "${BASELINE_BRANCH}" \
                "${LAST_MERGED_SHA}"

              git push \
                origin \
                "${BASELINE_BRANCH}" \
                --force

              BASELINE_SHA="${LAST_MERGED_SHA}"

              echo "Baseline updated."

            else

              echo "Baseline already represents latest merged sync."

            fi

          else

            echo "No previous merged synchronization PR found."

          fi


          # -------------------------------------------------------
          # Save baseline
          # -------------------------------------------------------

          echo "BASELINE_SHA=${BASELINE_SHA}" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "SYNC BASELINE"
          echo "=========================================="
          echo "${BASELINE_SHA}"


      # =========================================================
      # 7. Create synchronization branch FROM BASELINE
      # =========================================================

      - name: Create synchronization branch
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "Creating sync branch from baseline..."

          git fetch origin

          git checkout -B \
            "${{ inputs.sync_branch }}" \
            "${BASELINE_SHA}"

          echo ""
          echo "Sync branch:"
          git branch --show-current

          echo ""
          echo "Sync branch SHA:"
          git rev-parse HEAD


      # =========================================================
      # 8. Copy source files
      #
      # IMPORTANT:
      #
      # .github and .stratus are protected.
      # Everything else is synchronized.
      # =========================================================

      - name: Synchronize source files
        shell: bash
        run: |
          set -e

          echo "Synchronizing source files..."

          rsync \
            -av \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.stratus/' \
            source-repo/ \
            target-repo/

          echo ""
          echo "Synchronization copy completed."


      # =========================================================
      # 9. Explicitly restore protected directories
      # =========================================================

      - name: Protect .github and .stratus
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "Protected directories:"
          echo ".github"
          echo ".stratus"

          git restore \
            --source="${BASELINE_SHA}" \
            -- \
            .github \
            .stratus \
            2>/dev/null || true


      # =========================================================
      # 10. Show changes
      # =========================================================

      - name: Show synchronization changes
        shell: bash
        run: |
          set -e

          cd target-repo

          echo ""
          echo "=========================================="
          echo "CHANGES"
          echo "=========================================="

          git status --short

          echo ""
          echo "Changed files:"

          git diff \
            --name-status \
            "${BASELINE_SHA}" \
            -- \
            ':(exclude).github/**' \
            ':(exclude).stratus/**' \
            || true


      # =========================================================
      # 11. Stage changes
      # =========================================================

      - name: Stage changes
        shell: bash
        run: |
          set -e

          cd target-repo

          git add -A

          echo ""
          echo "Staged changes:"

          git diff \
            --cached \
            --name-status \
            -- \
            ':(exclude).github/**' \
            ':(exclude).stratus/**' \
            || true


      # =========================================================
      # 12. Check whether changes exist
      # =========================================================

      - name: Check changes
        shell: bash
        run: |
          set -e

          cd target-repo

          if git diff --cached --quiet; then

            echo "CHANGES_EXIST=false" >> "$GITHUB_ENV"

            echo ""
            echo "No changes detected."

          else

            echo "CHANGES_EXIST=true" >> "$GITHUB_ENV"

            echo ""
            echo "Changes detected."

          fi


      # =========================================================
      # 13. Commit synchronization branch
      # =========================================================

      - name: Commit synchronization changes
        if: env.CHANGES_EXIST == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          git commit \
            -m "Sync Phase 1 to Phase 2"

          echo ""
          echo "Synchronization commit:"
          git rev-parse HEAD


      # =========================================================
      # 14. Push synchronization branch
      # =========================================================

      - name: Push synchronization branch
        if: env.CHANGES_EXIST == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          git push \
            origin \
            "${{ inputs.sync_branch }}" \
            --force-with-lease


      # =========================================================
      # 15. Create / update Pull Request
      # =========================================================

      - name: Create Pull Request
        if: env.CHANGES_EXIST == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          PR_BODY="${{ inputs.pr_description }}

          ---

          ## Synchronization

          **Source repository:** ${SOURCE_REPO}

          **Source branch:** ${{ inputs.source_branch }}

          **Target repository:** ${TARGET_REPO}

          **Target branch:** ${{ inputs.target_branch }}

          **Synchronization branch:** ${{ inputs.sync_branch }}

          **Synchronization baseline:** ${BASELINE_SHA}

          ---

          ## Conflict handling

          This PR was created from the synchronization baseline.

          If the target branch and source changes modified the same lines/files since the baseline, GitHub will show its native **Resolve conflicts** option.

          Conflicts must be resolved manually by the developer.

          The workflow does not automatically resolve or merge conflicts.

          ---

          **Protected directories:** .github, .stratus
          "

          EXISTING_PR=$(
            gh pr list \
              --repo "${TARGET_REPO}" \
              --head "${{ inputs.sync_branch }}" \
              --base "${{ inputs.target_branch }}" \
              --state open \
              --json number \
              --jq '.[0].number' \
              || true
          )

          if [[ -n "${EXISTING_PR}" ]]; then

            echo "Existing PR found: #${EXISTING_PR}"

            gh pr edit \
              "${EXISTING_PR}" \
              --repo "${TARGET_REPO}" \
              --title "${{ inputs.pr_title }}" \
              --body "${PR_BODY}"

          else

            echo "Creating new Pull Request..."

            PR_URL=$(
              gh pr create \
                --repo "${TARGET_REPO}" \
                --base "${{ inputs.target_branch }}" \
                --head "${{ inputs.sync_branch }}" \
                --title "${{ inputs.pr_title }}" \
                --body "${PR_BODY}"
            )

            echo ""
            echo "=========================================="
            echo "PULL REQUEST"
            echo "=========================================="
            echo "${PR_URL}"

          fi


      # =========================================================
      # 16. Check GitHub native mergeability
      #
      # This does NOT modify the PR.
      # It only reports what GitHub calculated.
      # =========================================================

      - name: Check Pull Request mergeability
        if: env.CHANGES_EXIST == 'true'
        shell: bash
        run: |
          set -e

          echo "Waiting for GitHub to calculate mergeability..."

          sleep 10

          PR_NUMBER=$(
            gh pr list \
              --repo "${TARGET_REPO}" \
              --head "${{ inputs.sync_branch }}" \
              --base "${{ inputs.target_branch }}" \
              --state open \
              --json number \
              --jq '.[0].number'
          )

          echo "PR #${PR_NUMBER}"

          MERGEABLE=$(
            gh pr view \
              "${PR_NUMBER}" \
              --repo "${TARGET_REPO}" \
              --json mergeable \
              --jq '.mergeable'
          )

          echo ""
          echo "GitHub mergeability:"
          echo "${MERGEABLE}"

          if [[ "${MERGEABLE}" == "CONFLICTING" || "${MERGEABLE}" == "false" ]]; then

            echo ""
            echo "=========================================="
            echo "CONFLICT DETECTED BY GITHUB"
            echo "=========================================="

            echo ""
            echo "Open the PR and use GitHub's:"
            echo ""
            echo "Resolve conflicts"
            echo ""

          elif [[ "${MERGEABLE}" == "MERGEABLE" || "${MERGEABLE}" == "true" ]]; then

            echo ""
            echo "PR is currently mergeable."

          else

            echo ""
            echo "GitHub is still calculating mergeability."

          fi


      # =========================================================
      # 17. Final summary
      # =========================================================

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "PHASE 1 → PHASE 2"
          echo "=========================================="

          echo "Source : ${SOURCE_REPO}"
          echo "Target : ${TARGET_REPO}"
          echo "Source branch : ${{ inputs.source_branch }}"
          echo "Target branch : ${{ inputs.target_branch }}"
          echo "Sync branch : ${{ inputs.sync_branch }}"

          echo ""
          echo "No automatic merge was performed."

          echo ""
          echo "If GitHub reports conflicts:"
          echo "Developer resolves them using GitHub's Resolve conflicts button."


      # =========================================================
      # 18. Cleanup token
      # =========================================================

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.git-credentials"

          git config \
            --global \
            --unset credential.helper \
            || true
