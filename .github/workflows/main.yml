name: Sync Phase 1 to Phase 2

on:
  workflow_dispatch:
    inputs:

      github_token:
        description: "GitHub Personal Access Token with access to both repositories"
        required: true
        type: string

      source_branch:
        description: "Source branch. Example: main, master, feature/xyz"
        required: true
        default: "main"
        type: string

      target_repo:
        description: "Target Phase 2 repository. Example: setup-single-family-activations-p2-ui"
        required: true
        type: string

      target_branch:
        description: "Target branch. Example: main"
        required: true
        default: "main"
        type: string

      sync_branch:
        description: "New synchronization branch in target repository"
        required: true
        type: string

      pr_title:
        description: "Pull Request title"
        required: true
        type: string

      pr_description:
        description: "Pull Request description"
        required: false
        type: string


jobs:

  sync:
    name: Sync Phase 1 → Phase 2
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Validate inputs
      # ==========================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "VALIDATING INPUTS"
          echo "=================================================="

          if [ -z "${{ inputs.github_token }}" ]; then
            echo "ERROR: GitHub token is required."
            exit 1
          fi

          if [ -z "${{ inputs.source_branch }}" ]; then
            echo "ERROR: Source branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.target_repo }}" ]; then
            echo "ERROR: Target repository is required."
            exit 1
          fi

          if [ -z "${{ inputs.target_branch }}" ]; then
            echo "ERROR: Target branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.sync_branch }}" ]; then
            echo "ERROR: Synchronization branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.pr_title }}" ]; then
            echo "ERROR: Pull Request title is required."
            exit 1
          fi

          echo "Input validation completed successfully."


      # ==========================================================
      # 2. Determine repositories
      #
      # Source repository is automatically the current repository.
      # ==========================================================

      - name: Determine repositories
        id: repositories
        shell: bash
        run: |
          set -e

          SOURCE_REPO="${{ github.repository }}"
          TARGET_REPO="${{ inputs.target_repo }}"

          # If only repository name is provided,
          # automatically add the current repository owner.
          if [[ "$TARGET_REPO" != */* ]]; then
            TARGET_REPO="${{ github.repository_owner }}/$TARGET_REPO"
          fi

          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=================================================="
          echo "REPOSITORY CONFIGURATION"
          echo "=================================================="
          echo ""
          echo "Source Repository : $SOURCE_REPO"
          echo "Source Branch     : ${{ inputs.source_branch }}"
          echo ""
          echo "Target Repository : $TARGET_REPO"
          echo "Target Branch     : ${{ inputs.target_branch }}"
          echo ""
          echo "Sync Branch       : ${{ inputs.sync_branch }}"
          echo ""
          echo "Ignored:"
          echo "  .github/"
          echo "  .stratus/"
          echo "  .git/"
          echo ""
          echo "=================================================="


      # ==========================================================
      # 3. Configure Git authentication
      # ==========================================================

      - name: Configure Git authentication
        shell: bash
        env:
          GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global credential.helper store

          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN_INPUT" \
            > "$HOME/.git-credentials"

          chmod 600 "$HOME/.git-credentials"

          echo "Git authentication configured."


      # ==========================================================
      # 4. Clone target Phase 2 repository
      # ==========================================================

      - name: Clone target Phase 2 repository
        shell: bash
        run: |
          set -e

          TARGET_REPO="${{ steps.repositories.outputs.target_repo }}"

          rm -rf target-repo

          echo "=================================================="
          echo "CLONING TARGET REPOSITORY"
          echo "=================================================="
          echo ""
          echo "Repository : $TARGET_REPO"
          echo "Branch     : ${{ inputs.target_branch }}"
          echo ""

          git clone \
            --branch "${{ inputs.target_branch }}" \
            --single-branch \
            "https://github.com/${TARGET_REPO}.git" \
            target-repo

          cd target-repo

          echo ""
          echo "Target repository cloned successfully."


      # ==========================================================
      # 5. Clone current Phase 1 repository
      #
      # github.repository automatically identifies the current
      # repository where this workflow is running.
      # ==========================================================

      - name: Clone current Phase 1 repository
        shell: bash
        run: |
          set -e

          SOURCE_REPO="${{ steps.repositories.outputs.source_repo }}"

          rm -rf source-repo

          echo "=================================================="
          echo "CLONING SOURCE REPOSITORY"
          echo "=================================================="
          echo ""
          echo "Repository : $SOURCE_REPO"
          echo "Branch     : ${{ inputs.source_branch }}"
          echo ""

          git clone \
            --branch "${{ inputs.source_branch }}" \
            --single-branch \
            "https://github.com/${SOURCE_REPO}.git" \
            source-repo

          cd source-repo

          echo ""
          echo "Source repository cloned successfully."


      # ==========================================================
      # 6. Create synchronization branch
      # ==========================================================

      - name: Create synchronization branch
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=================================================="
          echo "CREATING SYNCHRONIZATION BRANCH"
          echo "=================================================="

          git checkout -b "${{ inputs.sync_branch }}"

          echo ""
          echo "Created branch:"
          git branch --show-current


      # ==========================================================
      # 7. Synchronize source → target
      #
      # --delete means:
      #
      # Source added file     → added
      # Source modified file  → updated
      # Source deleted file   → deleted
      #
      # .github and .stratus are excluded and therefore protected.
      # ==========================================================

      - name: Synchronize Phase 1 into Phase 2
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SYNCHRONIZING PHASE 1 → PHASE 2"
          echo "=================================================="
          echo ""
          echo "Added files     : will be synchronized"
          echo "Modified files  : will be synchronized"
          echo "Updated files   : will be synchronized"
          echo "Deleted files   : will be synchronized"
          echo ""
          echo "Protected:"
          echo "  .github/"
          echo "  .stratus/"
          echo "  .git/"
          echo ""

          rsync -av \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.stratus/' \
            source-repo/ \
            target-repo/

          echo ""
          echo "Synchronization completed."


      # ==========================================================
      # 8. Protect .github and .stratus
      #
      # This verifies that the target's protected folders were
      # not modified by the synchronization.
      # ==========================================================

      - name: Verify protected folders
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=================================================="
          echo "VERIFYING PROTECTED FOLDERS"
          echo "=================================================="

          echo ""
          echo ".github/ and .stratus/ were excluded from rsync."

          echo ""
          echo "Protected folders:"
          echo "  .github/"
          echo "  .stratus/"


      # ==========================================================
      # 9. Stage all changes
      #
      # git add -A detects:
      #   Added
      #   Modified
      #   Deleted
      # ==========================================================

      - name: Stage synchronization changes
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=================================================="
          echo "STAGING CHANGES"
          echo "=================================================="

          git add -A

          echo ""
          echo "Git status:"
          git status --short


      # ==========================================================
      # 10. Detect actual changes
      #
      # Explicitly exclude .github and .stratus from PR changes.
      # ==========================================================

      - name: Detect synchronization changes
        id: changes
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=================================================="
          echo "DETECTING CHANGES"
          echo "=================================================="

          CHANGED_FILES=$(git diff --cached --name-only -- \
            ':(exclude).github/**' \
            ':(exclude).stratus/**')

          if [ -z "$CHANGED_FILES" ]; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "NO CHANGES DETECTED."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "CHANGES DETECTED:"
            echo ""
            echo "$CHANGED_FILES"

          fi


      # ==========================================================
      # 11. Show exact changes
      # ==========================================================

      - name: Show synchronization changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=================================================="
          echo "CHANGES TO BE INCLUDED IN PR"
          echo "=================================================="
          echo ""

          git diff --cached --name-status -- \
            ':(exclude).github/**' \
            ':(exclude).stratus/**'

          echo ""
          echo "=================================================="
          echo "CHANGE SUMMARY"
          echo "=================================================="
          echo ""

          git diff --cached --stat -- \
            ':(exclude).github/**' \
            ':(exclude).stratus/**'


      # ==========================================================
      # 12. Commit changes
      # ==========================================================

      - name: Commit synchronization changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          git commit \
            -m "Sync Phase 1 into Phase 2"

          echo ""
          echo "Synchronization changes committed successfully."


      # ==========================================================
      # 13. Push synchronization branch
      # ==========================================================

      - name: Push synchronization branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          TARGET_BRANCH="${{ inputs.sync_branch }}"

          git push \
            origin \
            "$TARGET_BRANCH"

          echo ""
          echo "Synchronization branch pushed successfully."


      # ==========================================================
      # 14. Create Pull Request
      # ==========================================================

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ inputs.github_token }}
        run: |
          set -e

          TARGET_REPO="${{ steps.repositories.outputs.target_repo }}"

          cd target-repo

          echo "=================================================="
          echo "CREATING PULL REQUEST"
          echo "=================================================="

          PR_URL=$(gh pr create \
            --repo "$TARGET_REPO" \
            --base "${{ inputs.target_branch }}" \
            --head "${{ inputs.sync_branch }}" \
            --title "${{ inputs.pr_title }}" \
            --body "${{ inputs.pr_description }}")

          echo ""
          echo "=================================================="
          echo "PULL REQUEST CREATED"
          echo "=================================================="
          echo ""
          echo "$PR_URL"
          echo ""


      # ==========================================================
      # 15. No changes
      # ==========================================================

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "=================================================="
          echo "NO PULL REQUEST CREATED"
          echo "=================================================="
          echo ""
          echo "Source and target are already synchronized."
          echo ""


      # ==========================================================
      # 16. Cleanup credentials
      # ==========================================================

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.git-credentials"

          git config --global --unset credential.helper || true

          echo "Git credentials cleaned up."
