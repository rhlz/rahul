name: Sync Phase 1 to Phase 2

on:
  workflow_dispatch:
    inputs:

      github_token:
        description: "GitHub Personal Access Token with access to source and target repositories"
        required: true
        type: string

      source_branch:
        description: "Source branch (example: main, master, or feature/xyz)"
        required: true
        default: "main"
        type: string

      target_repo:
        description: "Target Phase 2 repository (example: setup-single-family-activations-p2-ui)"
        required: true
        type: string

      target_branch:
        description: "Target Phase 2 branch"
        required: true
        type: string

      sync_branch:
        description: "Branch to create in target repository"
        required: true
        type: string

      pr_title:
        description: "Pull Request title"
        required: true
        type: string

      pr_description:
        description: "Pull Request description"
        required: false
        type: string


jobs:

  sync:
    name: Sync Phase 1 → Phase 2
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Validate inputs
      # ==========================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -e

          echo "Validating inputs..."

          if [ -z "${{ inputs.github_token }}" ]; then
            echo "ERROR: GitHub token is required."
            exit 1
          fi

          if [ -z "${{ inputs.source_branch }}" ]; then
            echo "ERROR: Source branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.target_repo }}" ]; then
            echo "ERROR: Target repository is required."
            exit 1
          fi

          if [ -z "${{ inputs.target_branch }}" ]; then
            echo "ERROR: Target branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.sync_branch }}" ]; then
            echo "ERROR: Sync branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.pr_title }}" ]; then
            echo "ERROR: PR title is required."
            exit 1
          fi

          echo "Input validation completed successfully."


      # ==========================================================
      # 2. Determine source and target repositories
      # ==========================================================

      - name: Determine repositories
        id: repositories
        shell: bash
        run: |
          set -e

          SOURCE_REPO="${{ github.repository }}"
          TARGET_REPO="${{ inputs.target_repo }}"

          # If only repository name is provided,
          # automatically add the current repository owner.
          if [[ "$TARGET_REPO" != */* ]]; then
            TARGET_REPO="${{ github.repository_owner }}/$TARGET_REPO"
          fi

          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "Source Repository : $SOURCE_REPO"
          echo "Source Branch     : ${{ inputs.source_branch }}"
          echo ""
          echo "Target Repository : $TARGET_REPO"
          echo "Target Branch     : ${{ inputs.target_branch }}"
          echo "=============================================="


      # ==========================================================
      # 3. Configure Git authentication
      # ==========================================================

      - name: Configure Git authentication
        shell: bash
        env:
          GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global credential.helper store

          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN_INPUT" \
            > "$HOME/.git-credentials"

          chmod 600 "$HOME/.git-credentials"

          echo "Git authentication configured."


      # ==========================================================
      # 4. Clone target Phase 2 repository
      # ==========================================================

      - name: Clone target Phase 2 repository
        shell: bash
        run: |
          set -e

          TARGET_REPO="${{ steps.repositories.outputs.target_repo }}"

          rm -rf target-repo

          echo "Cloning target repository..."
          echo "Repository: $TARGET_REPO"
          echo "Branch: ${{ inputs.target_branch }}"

          git clone \
            --branch "${{ inputs.target_branch }}" \
            --single-branch \
            "https://github.com/${TARGET_REPO}.git" \
            target-repo

          cd target-repo

          echo ""
          echo "Target repository cloned successfully."


      # ==========================================================
      # 5. Clone current/source Phase 1 repository
      #
      # Source repository is automatically:
      # ${{ github.repository }}
      # ==========================================================

      - name: Clone current Phase 1 repository
        shell: bash
        run: |
          set -e

          SOURCE_REPO="${{ steps.repositories.outputs.source_repo }}"

          rm -rf source-repo

          echo "Cloning source repository..."
          echo "Repository: $SOURCE_REPO"
          echo "Branch: ${{ inputs.source_branch }}"

          git clone \
            --branch "${{ inputs.source_branch }}" \
            --single-branch \
            "https://github.com/${SOURCE_REPO}.git" \
            source-repo

          cd source-repo

          echo ""
          echo "Source repository cloned successfully."


      # ==========================================================
      # 6. Create synchronization branch
      # ==========================================================

      - name: Create synchronization branch
        shell: bash
        run: |
          set -e

          cd target-repo

          git checkout -b "${{ inputs.sync_branch }}"

          echo ""
          echo "Synchronization branch created:"
          git branch --show-current


      # ==========================================================
      # 7. Copy source files to target
      #
      # Ignored:
      #   .git/
      #   .github/
      #   .stratus/
      #
      # Target-only files are preserved.
      # ==========================================================

      - name: Copy Phase 1 files into Phase 2
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "Copying Phase 1 files into Phase 2"
          echo "=============================================="

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.stratus/' \
            source-repo/ \
            target-repo/

          echo ""
          echo "Files copied successfully."

          echo ""
          echo "Ignored:"
          echo "  .git/"
          echo "  .github/"
          echo "  .stratus/"


      # ==========================================================
      # 8. Stage all changes
      # ==========================================================

      - name: Stage synchronization changes
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=============================================="
          echo "Staging synchronization changes"
          echo "=============================================="

          git add -A

          echo ""
          echo "Git status:"
          git status --short


      # ==========================================================
      # 9. Show changes
      # ==========================================================

      - name: Show synchronization changes
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=============================================="
          echo "CHANGES TO BE INCLUDED IN PR"
          echo "=============================================="

          echo ""
          echo "Changed files:"
          git diff --cached --name-status

          echo ""
          echo "Change summary:"
          git diff --cached --stat

          echo ""
          echo "=============================================="


      # ==========================================================
      # 10. Check for changes
      # ==========================================================

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          set -e

          cd target-repo

          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "=============================================="
            echo "NO CHANGES DETECTED"
            echo "=============================================="

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "=============================================="
            echo "CHANGES DETECTED"
            echo "=============================================="

            git diff --cached --name-status

          fi


      # ==========================================================
      # 11. Commit changes
      # ==========================================================

      - name: Commit synchronization changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          git commit \
            -m "Sync Phase 1 into Phase 2"

          echo ""
          echo "Synchronization changes committed successfully."


      # ==========================================================
      # 12. Push synchronization branch
      # ==========================================================

      - name: Push synchronization branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          git push \
            origin \
            "${{ inputs.sync_branch }}"

          echo ""
          echo "Synchronization branch pushed successfully."


      # ==========================================================
      # 13. Create Pull Request
      # ==========================================================

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ inputs.github_token }}
        run: |
          set -e

          TARGET_REPO="${{ steps.repositories.outputs.target_repo }}"

          cd target-repo

          echo "Creating Pull Request..."

          PR_URL=$(gh pr create \
            --repo "$TARGET_REPO" \
            --base "${{ inputs.target_branch }}" \
            --head "${{ inputs.sync_branch }}" \
            --title "${{ inputs.pr_title }}" \
            --body "${{ inputs.pr_description }}")

          echo ""
          echo "=============================================="
          echo "PULL REQUEST CREATED"
          echo "=============================================="
          echo ""
          echo "$PR_URL"
          echo ""


      # ==========================================================
      # 14. No changes
      # ==========================================================

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "=============================================="
          echo "NO PULL REQUEST CREATED"
          echo "=============================================="
          echo ""
          echo "There are no changes to synchronize."


      # ==========================================================
      # 15. Cleanup credentials
      # ==========================================================

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.git-credentials"

          git config --global --unset credential.helper || true

          echo "Git credentials cleaned up."
