name: Sync Phase 1 to Phase 2

on:
  workflow_dispatch:
    inputs:

      github_token:
        description: "GitHub PAT with repo access"
        required: true
        type: string

      source_branch:
        description: "Source branch in current repository"
        required: true
        default: "main"
        type: string

      target_repo:
        description: "Phase 2 target repository. Example: setup-single-family-activations-p2-ui"
        required: true
        type: string

      target_branch:
        description: "Target branch in Phase 2 repository"
        required: true
        default: "main"
        type: string

      sync_branch:
        description: "Branch to create for synchronization"
        required: true
        default: "sync/phase1-to-phase2"
        type: string

      pr_title:
        description: "Pull Request title"
        required: true
        default: "Sync Phase 1 to Phase 2"
        type: string

      pr_description:
        description: "Pull Request description"
        required: false
        default: "Synchronization PR from Phase 1 to Phase 2."
        type: string


jobs:

  sync:
    name: Sync Phase 1 → Phase 2
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ inputs.github_token }}

    steps:

      # ---------------------------------------------------------
      # 1. Install tools
      # ---------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y rsync

          git --version
          rsync --version | head -1
          gh --version

      # ---------------------------------------------------------
      # 2. Identify source repository automatically
      # ---------------------------------------------------------
      - name: Set repository variables
        shell: bash
        run: |
          set -e

          SOURCE_REPO="${GITHUB_REPOSITORY}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          TARGET_REPO="${{ inputs.target_repo }}"

          if [[ "$TARGET_REPO" != */* ]]; then
            TARGET_REPO="${OWNER}/${TARGET_REPO}"
          fi

          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "TARGET_REPO=$TARGET_REPO" >> "$GITHUB_ENV"

          echo "Source repository : $SOURCE_REPO"
          echo "Target repository : $TARGET_REPO"
          echo "Source branch     : ${{ inputs.source_branch }}"
          echo "Target branch     : ${{ inputs.target_branch }}"
          echo "Sync branch       : ${{ inputs.sync_branch }}"

      # ---------------------------------------------------------
      # 3. Configure authentication
      # ---------------------------------------------------------
      - name: Configure Git authentication
        shell: bash
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global credential.helper store

          echo "https://x-access-token:${GH_TOKEN}@github.com" > "$HOME/.git-credentials"

          chmod 600 "$HOME/.git-credentials"

      # ---------------------------------------------------------
      # 4. Clone source repository
      # ---------------------------------------------------------
      - name: Clone source repository
        shell: bash
        run: |
          set -e

          rm -rf source-repo

          git clone \
            --branch "${{ inputs.source_branch }}" \
            --single-branch \
            "https://github.com/${SOURCE_REPO}.git" \
            source-repo

      # ---------------------------------------------------------
      # 5. Clone target repository
      # ---------------------------------------------------------
      - name: Clone target repository
        shell: bash
        run: |
          set -e

          rm -rf target-repo

          git clone \
            --branch "${{ inputs.target_branch }}" \
            --single-branch \
            "https://github.com/${TARGET_REPO}.git" \
            target-repo

      # ---------------------------------------------------------
      # 6. Fetch sync baseline
      # ---------------------------------------------------------
      - name: Fetch synchronization baseline
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "Checking for sync-baseline branch..."

          if git ls-remote --exit-code origin refs/heads/sync-baseline >/dev/null 2>&1; then

            echo "sync-baseline branch found."

            git fetch origin sync-baseline:refs/remotes/origin/sync-baseline

            git checkout -b sync-baseline-work origin/sync-baseline

            echo "BASELINE_AVAILABLE=true" >> "$GITHUB_ENV"

          else

            echo "No sync-baseline branch found."

            echo "BASELINE_AVAILABLE=false" >> "$GITHUB_ENV"

          fi

      # ---------------------------------------------------------
      # 7. Create synchronization branch
      # ---------------------------------------------------------
      - name: Create synchronization branch
        shell: bash
        run: |
          set -e

          cd target-repo

          git checkout "${{ inputs.target_branch }}"

          git pull origin "${{ inputs.target_branch }}"

          git checkout -B "${{ inputs.sync_branch }}"

          echo "Synchronization branch created."

      # ---------------------------------------------------------
      # 8. Prepare baseline
      # ---------------------------------------------------------
      - name: Prepare baseline
        shell: bash
        run: |
          set -e

          rm -rf baseline
          mkdir -p baseline

          if [[ "${BASELINE_AVAILABLE}" == "true" ]]; then

            echo "Using existing synchronization baseline."

            cd target-repo

            git archive origin/sync-baseline | tar -x -C ../baseline

            cd ..

          else

            echo "No baseline available."
            echo "Using target branch as initial baseline."

            rsync -a \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.stratus/' \
              target-repo/ \
              baseline/

          fi

      # ---------------------------------------------------------
      # 9. Prepare source snapshot
      # ---------------------------------------------------------
      - name: Prepare source snapshot
        shell: bash
        run: |
          set -e

          rm -rf source-snapshot
          mkdir -p source-snapshot

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.stratus/' \
            source-repo/ \
            source-snapshot/

      # ---------------------------------------------------------
      # 10. Prepare target snapshot
      # ---------------------------------------------------------
      - name: Prepare target snapshot
        shell: bash
        run: |
          set -e

          rm -rf target-snapshot
          mkdir -p target-snapshot

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.stratus/' \
            target-repo/ \
            target-snapshot/

      # ---------------------------------------------------------
      # 11. Run three-way synchronization
      # ---------------------------------------------------------
      - name: Perform three-way synchronization
        shell: bash
        run: |
          set -e

          rm -rf sync-result
          mkdir -p sync-result

          rm -f conflicts.txt

          touch conflicts.txt

          echo "=========================================="
          echo "Three-way synchronization"
          echo "=========================================="

          python3 <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          BASE = Path("baseline")
          SOURCE = Path("source-snapshot")
          TARGET = Path("target-snapshot")
          RESULT = Path("sync-result")

          CONFLICTS = Path("conflicts.txt")

          EXCLUDED = {
              ".github",
              ".stratus"
          }

          def is_excluded(rel):
              parts = Path(rel).parts
              return any(part in EXCLUDED for part in parts)

          def files_under(root):
              result = set()

              if not root.exists():
                  return result

              for path in root.rglob("*"):
                  if path.is_file():
                      rel = path.relative_to(root)

                      if not is_excluded(rel):
                          result.add(str(rel))

              return result

          def exists(root, rel):
              return (root / rel).exists()

          def same_file(a, b):
              if not a.exists() or not b.exists():
                  return False

              if a.stat().st_size != b.stat().st_size:
                  return False

              return a.read_bytes() == b.read_bytes()

          def is_text_file(path):
              try:
                  data = path.read_bytes()

                  if b"\x00" in data:
                      return False

                  data.decode("utf-8")
                  return True

              except Exception:
                  return False

          def copy_file(src, dst):
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          all_files = (
              files_under(BASE)
              | files_under(SOURCE)
              | files_under(TARGET)
          )

          conflict_files = []

          for rel in sorted(all_files):

              base = BASE / rel
              source = SOURCE / rel
              target = TARGET / rel
              result = RESULT / rel

              base_exists = base.exists()
              source_exists = source.exists()
              target_exists = target.exists()

              # --------------------------------------------------
              # File did not exist in baseline
              # --------------------------------------------------
              if not base_exists:

                  if source_exists and not target_exists:

                      copy_file(source, result)

                  elif target_exists and not source_exists:

                      copy_file(target, result)

                  elif source_exists and target_exists:

                      if same_file(source, target):

                          copy_file(source, result)

                      else:

                          # ADD/ADD conflict
                          if is_text_file(source) and is_text_file(target):

                              result.parent.mkdir(
                                  parents=True,
                                  exist_ok=True
                              )

                              try:

                                  subprocess.run(
                                      [
                                          "git",
                                          "merge-file",
                                          "-p",
                                          "--diff3",
                                          str(source),
                                          "/dev/null",
                                          str(target)
                                      ],
                                      stdout=open(result, "wb"),
                                      stderr=subprocess.PIPE,
                                      check=False
                                  )

                              except Exception:

                                  copy_file(source, result)

                          else:

                              copy_file(source, result)

                          conflict_files.append(rel)

                  continue

              # --------------------------------------------------
              # File existed in baseline
              # --------------------------------------------------

              source_changed = (
                  source_exists != base_exists
                  or (
                      source_exists
                      and not same_file(source, base)
                  )
              )

              target_changed = (
                  target_exists != base_exists
                  or (
                      target_exists
                      and not same_file(target, base)
                  )
              )

              # Neither changed
              if not source_changed and not target_changed:

                  if base_exists:
                      copy_file(base, result)

                  continue

              # Only source changed
              if source_changed and not target_changed:

                  if source_exists:
                      copy_file(source, result)

                  continue

              # Only target changed
              if target_changed and not source_changed:

                  if target_exists:
                      copy_file(target, result)

                  continue

              # Both changed
              # --------------------------------------------------

              # Both deleted
              if not source_exists and not target_exists:
                  continue

              # Both exist and are identical
              if source_exists and target_exists and same_file(source, target):

                  copy_file(source, result)
                  continue

              # Delete vs modify
              if not source_exists and target_exists:

                  conflict_files.append(rel)

                  copy_file(target, result)

                  continue

              if source_exists and not target_exists:

                  conflict_files.append(rel)

                  copy_file(source, result)

                  continue

              # --------------------------------------------------
              # Both modified
              # --------------------------------------------------

              if (
                  source_exists
                  and target_exists
                  and is_text_file(source)
                  and is_text_file(target)
                  and is_text_file(base)
              ):

                  result.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  merge = subprocess.run(
                      [
                          "git",
                          "merge-file",
                          "-p",
                          "--diff3",
                          str(source),
                          str(base),
                          str(target)
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE
                  )

                  result.write_bytes(merge.stdout)

                  if merge.returncode != 0:
                      conflict_files.append(rel)

              else:

                  # Binary conflict.
                  # Keep source version in PR and report conflict.
                  copy_file(source, result)

                  conflict_files.append(rel)

          CONFLICTS.write_text(
              "\n".join(conflict_files) + (
                  "\n" if conflict_files else ""
              ),
              encoding="utf-8"
          )

          print("")
          print("Synchronization completed.")

          if conflict_files:
              print("")
              print("CONFLICTS DETECTED:")
              for item in conflict_files:
                  print(f"  - {item}")
          else:
              print("No conflicts detected.")

          PY

      # ---------------------------------------------------------
      # 12. Apply synchronized result
      # ---------------------------------------------------------
      - name: Apply synchronization result
        shell: bash
        run: |
          set -e

          cd target-repo

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.stratus' \
            -exec rm -rf {} +

          rsync -a \
            ../sync-result/ \
            ./

          echo "Synchronization result applied."

      # ---------------------------------------------------------
      # 13. Stage changes
      # ---------------------------------------------------------
      - name: Stage changes
        shell: bash
        run: |
          set -e

          cd target-repo

          git add -A

          echo "Changed files:"
          git diff --cached --name-status || true

      # ---------------------------------------------------------
      # 14. Check whether changes exist
      # ---------------------------------------------------------
      - name: Check changes
        shell: bash
        run: |
          set -e

          cd target-repo

          if git diff --cached --quiet; then

            echo "No synchronization changes detected."

            echo "CHANGES_EXIST=false" >> "$GITHUB_ENV"

          else

            echo "Synchronization changes detected."

            echo "CHANGES_EXIST=true" >> "$GITHUB_ENV"

          fi

      # ---------------------------------------------------------
      # 15. Build conflict information
      # ---------------------------------------------------------
      - name: Prepare conflict information
        shell: bash
        run: |
          set -e

          if [[ -s conflicts.txt ]]; then

            echo "CONFLICTS_FOUND=true" >> "$GITHUB_ENV"

            {
              echo ""
              echo "## ⚠️ Synchronization Conflicts"
              echo ""
              echo "The synchronization detected conflicts."
              echo ""
              echo "The PR has intentionally been created so the developer can resolve them manually."
              echo ""
              echo "### Conflicting files"
              echo ""

              while IFS= read -r file; do
                [[ -z "$file" ]] && continue
                echo "- \`$file\`"
              done < conflicts.txt

              echo ""
              echo "### Action required"
              echo ""
              echo "Please resolve the conflicts manually before merging this PR."

            } > conflict-description.txt

          else

            echo "CONFLICTS_FOUND=false" >> "$GITHUB_ENV"

            {
              echo ""
              echo "## ✅ No synchronization conflicts detected"
              echo ""
              echo "The synchronization was completed without detected three-way conflicts."

            } > conflict-description.txt

          fi

      # ---------------------------------------------------------
      # 16. Commit synchronization branch
      # ---------------------------------------------------------
      - name: Commit synchronization changes
        if: env.CHANGES_EXIST == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          if [[ "${CONFLICTS_FOUND}" == "true" ]]; then

            COMMIT_MESSAGE="Sync Phase 1 to Phase 2 with conflict resolution required"

          else

            COMMIT_MESSAGE="Sync Phase 1 to Phase 2"

          fi

          git commit -m "$COMMIT_MESSAGE"

      # ---------------------------------------------------------
      # 17. Push synchronization branch
      # ---------------------------------------------------------
      - name: Push synchronization branch
        if: env.CHANGES_EXIST == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          git push \
            origin \
            "${{ inputs.sync_branch }}" \
            --force

      # ---------------------------------------------------------
      # 18. Create Pull Request
      # ---------------------------------------------------------
      - name: Create Pull Request
        if: env.CHANGES_EXIST == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          BASE_DESCRIPTION="${{ inputs.pr_description }}"

          FULL_DESCRIPTION="${BASE_DESCRIPTION}

          ---

          $(cat ../conflict-description.txt)

          ---

          **Source repository:** ${SOURCE_REPO}

          **Source branch:** ${{ inputs.source_branch }}

          **Target repository:** ${TARGET_REPO}

          **Target branch:** ${{ inputs.target_branch }}

          **Synchronization branch:** ${{ inputs.sync_branch }}

          This PR was created automatically by the Phase 1 → Phase 2 synchronization workflow.
          "

          EXISTING_PR=$(gh pr list \
            --repo "${TARGET_REPO}" \
            --head "${{ inputs.sync_branch }}" \
            --base "${{ inputs.target_branch }}" \
            --state open \
            --json number \
            --jq '.[0].number' || true)

          if [[ -n "$EXISTING_PR" ]]; then

            echo "Existing PR found: #${EXISTING_PR}"

            gh pr edit "$EXISTING_PR" \
              --repo "${TARGET_REPO}" \
              --title "${{ inputs.pr_title }}" \
              --body "$FULL_DESCRIPTION"

          else

            PR_URL=$(gh pr create \
              --repo "${TARGET_REPO}" \
              --base "${{ inputs.target_branch }}" \
              --head "${{ inputs.sync_branch }}" \
              --title "${{ inputs.pr_title }}" \
              --body "$FULL_DESCRIPTION")

            echo "Pull Request created:"
            echo "$PR_URL"

          fi

      # ---------------------------------------------------------
      # 19. Summary
      # ---------------------------------------------------------
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Phase 1 → Phase 2 Synchronization"
          echo "=========================================="
          echo ""
          echo "Source : ${SOURCE_REPO}"
          echo "Target : ${TARGET_REPO}"
          echo "Branch : ${{ inputs.sync_branch }}"
          echo ""

          if [[ "${CONFLICTS_FOUND:-false}" == "true" ]]; then
            echo "STATUS: CONFLICTS DETECTED"
            echo ""
            echo "PR was created."
            echo "Developer must manually resolve conflicts."
          else
            echo "STATUS: SYNCHRONIZATION COMPLETED"
          fi

      # ---------------------------------------------------------
      # 20. Cleanup credentials
      # ---------------------------------------------------------
      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.git-credentials"
          git config --global --unset credential.helper || true
