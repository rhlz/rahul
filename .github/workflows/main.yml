name: Sync Phase 1 to Phase 2

on:
  workflow_dispatch:
    inputs:

      github_token:
        description: "GitHub Personal Access Token with access to both repositories"
        required: true
        type: string

      phase1_repo:
        description: "Phase 1 source repository"
        required: true
        type: string

      phase1_branch:
        description: "Phase 1 source branch"
        required: true
        type: string

      phase2_repo:
        description: "Phase 2 target repository"
        required: true
        type: string

      phase2_branch:
        description: "Phase 2 target branch"
        required: true
        type: string

      sync_branch:
        description: "Branch to create in Phase 2 repository"
        required: true
        type: string

      pr_title:
        description: "Pull Request title"
        required: true
        type: string

      pr_description:
        description: "Pull Request description"
        required: false
        type: string


jobs:

  sync:
    name: Sync Phase 1 → Phase 2
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Validate inputs
      # ==========================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -e

          echo "Validating inputs..."

          if [ -z "${{ inputs.github_token }}" ]; then
            echo "ERROR: GitHub token is required."
            exit 1
          fi

          if [ -z "${{ inputs.phase1_repo }}" ]; then
            echo "ERROR: Phase 1 repository is required."
            exit 1
          fi

          if [ -z "${{ inputs.phase1_branch }}" ]; then
            echo "ERROR: Phase 1 branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.phase2_repo }}" ]; then
            echo "ERROR: Phase 2 repository is required."
            exit 1
          fi

          if [ -z "${{ inputs.phase2_branch }}" ]; then
            echo "ERROR: Phase 2 branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.sync_branch }}" ]; then
            echo "ERROR: Sync branch is required."
            exit 1
          fi

          if [ -z "${{ inputs.pr_title }}" ]; then
            echo "ERROR: PR title is required."
            exit 1
          fi

          echo "Input validation completed successfully."


      # ==========================================================
      # 2. Display synchronization details
      # ==========================================================

      - name: Display synchronization details
        shell: bash
        run: |
          echo "=================================================="
          echo "        PHASE 1 → PHASE 2 SYNCHRONIZATION"
          echo "=================================================="
          echo ""
          echo "Source Repository : ${{ inputs.phase1_repo }}"
          echo "Source Branch     : ${{ inputs.phase1_branch }}"
          echo ""
          echo "Target Repository : ${{ inputs.phase2_repo }}"
          echo "Target Branch     : ${{ inputs.phase2_branch }}"
          echo ""
          echo "Sync Branch       : ${{ inputs.sync_branch }}"
          echo ""
          echo "PR Title          : ${{ inputs.pr_title }}"
          echo ""
          echo "=================================================="


      # ==========================================================
      # 3. Configure Git authentication
      # ==========================================================

      - name: Configure Git authentication
        shell: bash
        env:
          GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global credential.helper store

          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN_INPUT" \
            > "$HOME/.git-credentials"

          chmod 600 "$HOME/.git-credentials"

          echo "Git authentication configured."


      # ==========================================================
      # 4. Clone Phase 2 target repository
      # ==========================================================

      - name: Clone Phase 2 repository
        shell: bash
        run: |
          set -e

          rm -rf target-repo

          git clone \
            --branch "${{ inputs.phase2_branch }}" \
            --single-branch \
            "https://github.com/${{ github.repository_owner }}/${{ inputs.phase2_repo }}.git" \
            target-repo

          cd target-repo

          echo "Target repository cloned successfully."


      # ==========================================================
      # 5. Clone Phase 1 source repository
      # ==========================================================

      - name: Clone Phase 1 repository
        shell: bash
        run: |
          set -e

          rm -rf source-repo

          git clone \
            --branch "${{ inputs.phase1_branch }}" \
            --single-branch \
            "https://github.com/${{ github.repository_owner }}/${{ inputs.phase1_repo }}.git" \
            source-repo

          cd source-repo

          echo "Source repository cloned successfully."


      # ==========================================================
      # 6. Create synchronization branch
      # ==========================================================

      - name: Create synchronization branch
        shell: bash
        run: |
          set -e

          cd target-repo

          git checkout -b "${{ inputs.sync_branch }}"

          echo ""
          echo "Synchronization branch created:"
          git branch --show-current


      # ==========================================================
      # 7. Copy Phase 1 files into Phase 2
      #
      # IMPORTANT:
      # No git merge is performed.
      #
      # Existing target-only files are NOT deleted.
      # ==========================================================

      - name: Copy Phase 1 files into Phase 2
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "Copying Phase 1 files into Phase 2"
          echo "=================================================="

          rsync -av \
            --exclude='.git' \
            source-repo/ \
            target-repo/

          echo ""
          echo "Files copied successfully."


      # ==========================================================
      # 8. Stage all changes
      #
      # This is important because git diff does not detect
      # untracked files until they are staged.
      # ==========================================================

      - name: Stage synchronization changes
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=================================================="
          echo "STAGING SYNCHRONIZATION CHANGES"
          echo "=================================================="

          git add -A

          echo ""
          echo "Staged changes:"
          git status --short


      # ==========================================================
      # 9. Show synchronization changes
      # ==========================================================

      - name: Show synchronization changes
        shell: bash
        run: |
          set -e

          cd target-repo

          echo "=================================================="
          echo "CHANGES TO BE INCLUDED IN PR"
          echo "=================================================="

          echo ""
          echo "Changed files:"
          git diff --cached --name-status

          echo ""
          echo "Detailed changes:"
          git diff --cached --stat

          echo ""
          echo "=================================================="


      # ==========================================================
      # 10. Check for changes
      # ==========================================================

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          set -e

          cd target-repo

          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "=================================================="
            echo "NO CHANGES DETECTED"
            echo "=================================================="
            echo ""
            echo "Source and target repositories have no file changes."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "=================================================="
            echo "CHANGES DETECTED"
            echo "=================================================="
            echo ""

            git diff --cached --name-status

          fi


      # ==========================================================
      # 11. Commit synchronization changes
      # ==========================================================

      - name: Commit synchronization changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          git commit \
            -m "Sync Phase 1 into Phase 2"

          echo ""
          echo "Synchronization changes committed successfully."


      # ==========================================================
      # 12. Push synchronization branch
      # ==========================================================

      - name: Push synchronization branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd target-repo

          git push \
            origin \
            "${{ inputs.sync_branch }}"

          echo ""
          echo "Synchronization branch pushed successfully."


      # ==========================================================
      # 13. Create Pull Request
      # ==========================================================

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ inputs.github_token }}
        run: |
          set -e

          cd target-repo

          echo "Creating Pull Request..."

          PR_URL=$(gh pr create \
            --repo "${{ github.repository_owner }}/${{ inputs.phase2_repo }}" \
            --base "${{ inputs.phase2_branch }}" \
            --head "${{ inputs.sync_branch }}" \
            --title "${{ inputs.pr_title }}" \
            --body "${{ inputs.pr_description }}")

          echo ""
          echo "=================================================="
          echo "PULL REQUEST CREATED"
          echo "=================================================="
          echo ""
          echo "$PR_URL"
          echo ""
          echo "=================================================="


      # ==========================================================
      # 14. No changes message
      # ==========================================================

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "=================================================="
          echo "NO PULL REQUEST CREATED"
          echo "=================================================="
          echo ""
          echo "There are no changes to synchronize."
          echo ""


      # ==========================================================
      # 15. Final summary
      # ==========================================================

      - name: Synchronization summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "              SYNCHRONIZATION SUMMARY"
          echo "=================================================="
          echo ""
          echo "Direction         : Phase 1 → Phase 2"
          echo ""
          echo "Source Repository : ${{ inputs.phase1_repo }}"
          echo "Source Branch     : ${{ inputs.phase1_branch }}"
          echo ""
          echo "Target Repository : ${{ inputs.phase2_repo }}"
          echo "Target Branch     : ${{ inputs.phase2_branch }}"
          echo ""
          echo "Sync Branch       : ${{ inputs.sync_branch }}"
          echo ""
          echo "=================================================="


      # ==========================================================
      # 16. Cleanup credentials
      # ==========================================================

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.git-credentials"

          git config --global --unset credential.helper || true

          echo "Git credentials cleaned up."
